name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v1.0.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Kept in sync with ci.yml's COVERAGE_GATE - a release must clear the same
  # bar as every merge to main.
  COVERAGE_GATE: '94'

jobs:
  validate-and-release:
    name: Validate and publish GitHub Release
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' does not match the required vX.Y.Z format."
          }
          $version = $Matches[1]
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Releasing tag '$tag' (version $version)."

      - name: Verify module manifest version matches the tag
        run: |
          $manifest = Test-ModuleManifest .\NetClean.psd1
          $expected = '${{ steps.tag.outputs.version }}'
          if ($manifest.Version.ToString() -ne $expected) {
            throw "NetClean.psd1 ModuleVersion ($($manifest.Version)) does not match tag version ($expected). Update the manifest and re-tag before releasing."
          }
          Write-Host 'Module manifest version matches the release tag.'

      - name: Resolve PowerShell 7 user module path
        id: modpath
        run: |
          $path = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Modules'
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.modpath.outputs.path }}
          key: ps7-modules-Pester6.0.1-PSScriptAnalyzer1.25.0-v1

      - name: Install PowerShell test and analysis tools
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -eq ([version]'6.0.1'))) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module Pester -Scope CurrentUser -RequiredVersion 6.0.1 -Force -SkipPublisherCheck -ErrorAction Stop
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object Version -eq ([version]'1.25.0'))) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -RequiredVersion 1.25.0 -Force -ErrorAction Stop
          }
          Import-Module Pester -RequiredVersion 6.0.1 -Force -ErrorAction Stop
          if ((Get-Module Pester).Version -ne [version]'6.0.1') {
            throw 'Release requires Pester 6.0.1.'
          }

      - name: Run PSScriptAnalyzer
        run: |
          .\tests\Invoke-NetCleanAnalyzer.ps1 | Format-List

      - name: Run Pester with coverage
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\Run-NetClean-Coverage.ps1 -MinimumCoverage $env:COVERAGE_GATE

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $lines = Get-Content -LiteralPath CHANGELOG.md
          $startIdx = $null
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))\b") {
              $startIdx = $i
              break
            }
          }
          if ($null -eq $startIdx) {
            throw "No '## $version' section found in CHANGELOG.md. Add one before tagging a release."
          }
          $endIdx = $lines.Count - 1
          for ($i = $startIdx + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') {
              $endIdx = $i - 1
              break
            }
          }
          $section = ($lines[($startIdx + 1)..$endIdx] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($section)) {
            throw "The '## $version' section in CHANGELOG.md is empty."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $section -Encoding utf8
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $version = '${{ steps.tag.outputs.version }}'
          $notesPath = '${{ steps.notes.outputs.notes_path }}'
          $existing = gh release view $tag --json name 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; updating it in place."
            gh release edit $tag --title "NetClean $version" --notes-file $notesPath
          }
          else {
            gh release create $tag --title "NetClean $version" --notes-file $notesPath --verify-tag
          }
