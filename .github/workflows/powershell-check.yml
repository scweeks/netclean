name: PowerShell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-cover:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          try {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          } catch { }

          Install-Module -Name Pester -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'

          $files = Get-ChildItem -Path $PWD -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.ps1', '.psm1' -and
              $_.FullName -notmatch '\\.git\\' -and
              $_.FullName -notmatch '\\.ai\\'
            } |
            Select-Object -ExpandProperty FullName

          if (-not $files) {
            Write-Host 'No PowerShell files found for analysis.'
            exit 0
          }

          if (Test-Path $settings) {
            $results = Invoke-ScriptAnalyzer -Path $files -SettingsPath $settings -Recurse -ErrorAction SilentlyContinue
          }
          else {
            $results = Invoke-ScriptAnalyzer -Path $files -Recurse -ErrorAction SilentlyContinue
          }

          if ($results) {
            $results | ForEach-Object {
              Write-Host "[$($_.Severity)] $($_.ScriptName):$($_.Line) $($_.RuleName) - $($_.Message)"
            }
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

          Write-Host 'No findings from PSScriptAnalyzer.'

      - name: Run Pester tests
        shell: pwsh
        run: |
          $tests = @(
            (Join-Path $PWD 'Netclean.Module.Tests.ps1'),
            (Join-Path $PWD 'NetClean.Script.Tests.ps1')
          ) | Where-Object { Test-Path $_ }

          if (-not $tests) {
            throw 'No expected Pester test files were found.'
          }

          $result = Invoke-Pester -Path $tests -PassThru

          if ($result.FailedCount -gt 0) {
            throw "Pester tests failed: $($result.FailedCount)"
          }

      - name: Generate coverage report
        shell: pwsh
        run: |
          $coverageScript = Join-Path $PWD 'Run-NetClean-Coverage.ps1'
          if (-not (Test-Path $coverageScript)) {
            throw 'Coverage script Run-NetClean-Coverage.ps1 was not found.'
          }

          & $coverageScript

          $coverageXml = Join-Path $PWD 'coverage.xml'
          if (-not (Test-Path $coverageXml)) {
            throw 'coverage.xml was not generated.'
          }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: netclean-coverage
          path: coverage.xml