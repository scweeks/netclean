name: CI

on:
  push:
    branches:
      - main
      - 'ci/**'
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
  workflow_dispatch:
    inputs:
      force-module-refresh:
        description: 'Set to true to clear module cache and force fresh installs'
        required: false
        type: boolean
        default: false
      coverage-gate:
        description: 'Coverage gate percent (overrides default)'
        required: false
        type: number
        default: 94

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Default coverage gate; can be overridden by workflow_dispatch input
  COVERAGE_GATE: '94'

jobs:
  test-and-analyze:
    name: PSSA + Pester + Coverage
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve runtime inputs
        id: inputs
        run: |
          # Read workflow_dispatch inputs directly from the event payload so hyphenated input IDs stay reliable.
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $force = [string]$event.inputs.'force-module-refresh'
          if ([string]::IsNullOrWhiteSpace($force)) { $force = 'false' }
          else { $force = $force.ToLowerInvariant() }
          "force=$force" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $cov = [string]$event.inputs.'coverage-gate'
          if ([string]::IsNullOrWhiteSpace($cov)) { $cov = '94' }
          "coverage_gate=$cov" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Show PowerShell environment
        run: |
          $PSVersionTable
          Get-Module Pester -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 5 Name, Version, Path

      - name: Prepare module cache path
        id: prep_cache
        run: |
          $cachePath = Join-Path $env:RUNNER_TEMP 'psmodules'
          if (-not (Test-Path $cachePath)) { New-Item -ItemType Directory -Path $cachePath | Out-Null }
          "cachePath=$cachePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Restore module cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.prep_cache.outputs.cachePath }}
          key: ps-modules-${{ runner.os }}-${{ hashFiles('**/modules.lock.json','**/*.psd1') }}
          restore-keys: |
            ps-modules-${{ runner.os }}-

      - name: Ensure repo modules are preferred and PSModulePath set
        run: |
          $repoModulePath = (Resolve-Path -Path ./src -ErrorAction SilentlyContinue)
          if ($repoModulePath) {
            $repoModulePath = $repoModulePath.Path
            $env:PSModulePath = "$repoModulePath;$env:PSModulePath"
            Write-Host "Prepended repo module path: $repoModulePath"
          } else {
            Write-Host "No ./src folder found to prefer for modules."
          }
          $cachePath = '${{ steps.prep_cache.outputs.cachePath }}'
          $env:PSModulePath = "$cachePath;$env:PSModulePath"
          Write-Host "PSModulePath: $env:PSModulePath"

      - name: Optionally clear cached modules (workflow_dispatch toggle)
        if: ${{ steps.inputs.outputs.force == 'true' }}
        run: |
          $cachePath = '${{ steps.prep_cache.outputs.cachePath }}'
          if (Test-Path $cachePath) {
            Write-Host "Clearing cached modules at $cachePath"
            Remove-Item -Recurse -Force $cachePath
            New-Item -ItemType Directory -Path $cachePath | Out-Null
          } else {
            Write-Host "Cache path not present; nothing to remove."
          }

      - name: Install PowerShell test and analysis tools (cache-aware)
        env:
          FORCE_MODULE_REFRESH: ${{ steps.inputs.outputs.force }}
        run: |
          $cachePath = '${{ steps.prep_cache.outputs.cachePath }}'

          # Ensure cache path is on PSModulePath (after repo path which is already prepended)
          if (-not ($env:PSModulePath -split ';' | Where-Object { $_ -eq $cachePath })) {
            $env:PSModulePath = "$cachePath;$env:PSModulePath"
          }
          Write-Host "PSModulePath now: $env:PSModulePath"

          # Debug listing before install
          Write-Host "Cache path contents before install:"
          Get-ChildItem -LiteralPath $cachePath -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName, Mode, Length | Format-Table -AutoSize

          # Use Save-Module to download module files into the cache path (creates Pester\<version>\)
          $needPester = -not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'6.0.1' })
          if ($env:FORCE_MODULE_REFRESH -eq 'true') { $needPester = $true }
          if ($needPester) {
            Write-Host "Saving Pester 6.0.1 into $cachePath"
            Save-Module -Name Pester -RequiredVersion 6.0.1 -Path $cachePath -Force -ErrorAction Stop
          } else {
            Write-Host "Pester 6.0.1 already available in module path."
          }

          $needPssa = -not (Get-Module -ListAvailable -Name PSScriptAnalyzer)
          if ($env:FORCE_MODULE_REFRESH -eq 'true') { $needPssa = $true }
          if ($needPssa) {
            Write-Host "Saving PSScriptAnalyzer 1.25.0 into $cachePath"
            Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Path $cachePath -Force -ErrorAction Stop
          } else {
            Write-Host "PSScriptAnalyzer already available in module path."
          }

          # Debug listing after save
          Write-Host "Cache path contents after save:"
          Get-ChildItem -LiteralPath $cachePath -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize

          # Verify Pester manifest exists and import explicitly by manifest path
          $pesterManifest = Join-Path $cachePath 'Pester\6.0.1\Pester.psd1'
          if (Test-Path -LiteralPath $pesterManifest) {
            Write-Host "Found Pester manifest at $pesterManifest"
          } else {
            Write-Host "Pester manifest not found at expected path: $pesterManifest"
            Write-Host "Listing $cachePath for debugging:"
            Get-ChildItem -LiteralPath $cachePath -Recurse | Select-Object FullName | Format-Table -AutoSize
            throw "Pester 6.0.1 not found in cache path after Save-Module."
          }

          # Import by manifest path to avoid name-resolution issues
          Import-Module -LiteralPath $pesterManifest -Force -ErrorAction Stop

          # Confirm available modules
          Write-Host "Available Pester modules:"
          Get-Module -ListAvailable -Name Pester | Select-Object Name, Version, Path | Format-Table -AutoSize
          Write-Host "Available PSScriptAnalyzer modules:"
          Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object Name, Version, Path | Format-Table -AutoSize



      - name: Validate module manifest
        run: |
          Test-ModuleManifest .\NetClean.psd1 | Out-Null
          Write-Host 'Module manifest validated successfully.'

      - name: Run PSScriptAnalyzer
        run: |
          .\tests\Invoke-NetCleanAnalyzer.ps1 | Format-List

      - name: Run Pester with coverage
        env:
          COVERAGE_GATE: ${{ steps.inputs.outputs.coverage_gate }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\Run-NetClean-Coverage.ps1 -MinimumCoverage $env:COVERAGE_GATE

      - name: Locate coverage output (if present)
        id: find_coverage
        run: |
          $candidates = Get-ChildItem -Path tests/TestResults -Recurse -Filter 'coverage*.xml' -ErrorAction SilentlyContinue |
                        Select-Object -First 1 -ExpandProperty FullName
          if (-not $candidates) {
            if (Test-Path -Path coverage.xml) { $candidates = (Resolve-Path coverage.xml).Path }
          }
          if ($candidates) {
            Write-Host "Found coverage file: $candidates"
            "coverage_path=$candidates" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "No coverage file found."
            "coverage_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netclean-test-results
          path: |
            tests/TestResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage artifact (for badge generation)
        if: always() && steps.find_coverage.outputs.coverage_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: ${{ steps.find_coverage.outputs.coverage_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce coverage gate (fail if below threshold)
        if: always() && steps.find_coverage.outputs.coverage_path != ''
        run: |
          $covPath = '${{ steps.find_coverage.outputs.coverage_path }}'
          if (-not (Test-Path $covPath)) {
            throw "Coverage file not found at expected path: $covPath"
          }
          [xml]$doc = Get-Content $covPath
          $lineCounter = $doc.SelectNodes("//counter") | Where-Object { $_.GetAttribute('type') -eq 'LINE' } | Select-Object -First 1
          if (-not $lineCounter) {
            Write-Host "No LINE counter found in coverage XML; skipping numeric gate enforcement."
            exit 0
          }
          $missed = [int]$lineCounter.GetAttribute('missed')
          $covered = [int]$lineCounter.GetAttribute('covered')
          $total = $missed + $covered
          $percent = if ($total -gt 0) { [math]::Round(($covered / $total) * 100, 2) } else { 100 }
          Write-Host "Line coverage: $percent`% (covered: $covered, missed: $missed)"
          $gateValue = '${{ steps.inputs.outputs.coverage_gate }}'
          $gate = [double]$gateValue
          if ($percent -lt $gate) {
            throw "Coverage $percent% is below required $gate%."
          }

  publish-coverage-badge:
    name: Publish coverage badge
    needs: test-and-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: coverage
          path: coverage-artifact

      - name: Generate GitHub Pages coverage badge payload
        run: |
          $coverageXmlPath = Join-Path $env:GITHUB_WORKSPACE 'coverage-artifact/coverage.xml'
          if (-not (Test-Path -LiteralPath $coverageXmlPath)) {
            throw "Coverage XML not found at $coverageXmlPath"
          }

          [xml]$doc = Get-Content -LiteralPath $coverageXmlPath
          $lineCounter = $doc.SelectNodes('//counter') | Where-Object { $_.GetAttribute('type') -eq 'LINE' } | Select-Object -First 1
          if (-not $lineCounter) {
            throw 'No LINE counter found in coverage XML.'
          }

          $missed = [int]$lineCounter.GetAttribute('missed')
          $covered = [int]$lineCounter.GetAttribute('covered')
          $total = $missed + $covered
          $percent = if ($total -gt 0) { [math]::Round(($covered / $total) * 100, 2) } else { 100 }
          $message = '{0:N2}%' -f $percent
          $color = if ($percent -ge 94) { 'brightgreen' } elseif ($percent -ge 90) { 'green' } elseif ($percent -ge 80) { 'yellow' } else { 'red' }

          $sitePath = Join-Path $env:GITHUB_WORKSPACE 'pages-site'
          New-Item -ItemType Directory -Path $sitePath -Force | Out-Null

          $badge = [ordered]@{
            schemaVersion = 1
            label = 'coverage'
            message = $message
            color = $color
          }

          $badge | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $sitePath 'coverage.json') -Encoding utf8
          @(
            '<!doctype html>',
            '<html lang="en">',
            '<head>',
            '  <meta charset="utf-8">',
            '  <meta name="viewport" content="width=device-width, initial-scale=1">',
            '  <title>NetClean coverage badge</title>',
            '</head>',
            '<body>',
            '  <p>NetClean coverage badge JSON is published at <a href="coverage.json">coverage.json</a>.</p>',
            '</body>',
            '</html>'
          ) -join [Environment]::NewLine | Set-Content -LiteralPath (Join-Path $sitePath 'index.html') -Encoding utf8

      - name: Upload GitHub Pages site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  windows-powershell-compatibility:
    name: Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve runtime inputs
        id: inputs
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $force = [string]$event.inputs.'force-module-refresh'
          if ([string]::IsNullOrWhiteSpace($force)) { $force = 'false' }
          else { $force = $force.ToLowerInvariant() }
          "force=$force" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare module cache path (ps51)
        id: prep_cache_ps51
        run: |
          $cachePath = Join-Path $env:RUNNER_TEMP 'psmodules_ps51'
          if (-not (Test-Path $cachePath)) { New-Item -ItemType Directory -Path $cachePath | Out-Null }
          "cachePath=$cachePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Restore module cache (ps51)
        uses: actions/cache@v4
        with:
          path: ${{ steps.prep_cache_ps51.outputs.cachePath }}
          key: ps-modules-ps51-${{ runner.os }}-${{ hashFiles('**/modules.lock.json','**/*.psd1') }}
          restore-keys: |
            ps-modules-ps51-${{ runner.os }}-

      - name: Ensure repo modules are preferred and PSModulePath set (ps51)
        run: |
          $repoModulePath = (Resolve-Path -Path ./src -ErrorAction SilentlyContinue)
          if ($repoModulePath) {
            $repoModulePath = $repoModulePath.Path
            $env:PSModulePath = "$repoModulePath;$env:PSModulePath"
            Write-Host "Prepended repo module path: $repoModulePath"
          } else {
            Write-Host "No ./src folder found to prefer for modules."
          }
          $cachePath = '${{ steps.prep_cache_ps51.outputs.cachePath }}'
          $env:PSModulePath = "$cachePath;$env:PSModulePath"
          Write-Host "PSModulePath: $env:PSModulePath"

      - name: Optionally clear cached modules (FORCE_MODULE_REFRESH)
        if: ${{ steps.inputs.outputs.force == 'true' }}
        run: |
          $cachePath = '${{ steps.prep_cache_ps51.outputs.cachePath }}'
          if (Test-Path $cachePath) {
            Write-Host "Clearing cached modules at $cachePath"
            Remove-Item -Recurse -Force $cachePath
            New-Item -ItemType Directory -Path $cachePath | Out-Null
          } else {
            Write-Host "Cache path not present; nothing to remove."
          }

      - name: Install compatibility test tools (ps51)
        run: |
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $cachePath = '${{ steps.prep_cache_ps51.outputs.cachePath }}'
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'6.0.1' })) {
            Save-Module Pester -Path $cachePath -RequiredVersion 6.0.1 -Force -ErrorAction Stop
          } else {
            Write-Host "Pester 6.0.1 already available in module path."
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Save-Module PSScriptAnalyzer -Path $cachePath -RequiredVersion 1.25.0 -Force -ErrorAction Stop
          } else {
            Write-Host "PSScriptAnalyzer already available in module path."
          }
          Import-Module Pester -RequiredVersion 6.0.1 -Force -ErrorAction Stop
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -ErrorAction Stop

      - name: Validate module manifest
        run: |
          Test-ModuleManifest .\NetClean.psd1 | Out-Null
          Write-Output 'Module manifest validated successfully under Windows PowerShell 5.1.'

      - name: Run complete Pester suite
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = (Resolve-Path .\tests).Path
          $config.Run.PassThru = $true
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Normal'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed test(s) under Windows PowerShell 5.1."
          }

  comment-coverage:
    name: Comment coverage on pull request
    # Only run for same-repo PRs to avoid token permission issues on forks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test-and-analyze
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download test and coverage artifacts (test results)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: netclean-test-results
          path: tests/TestResults

      - name: Download coverage artifact (for PR comment)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: coverage
          path: tests/TestResults

      - name: Comment PR with coverage summary
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/tests/TestResults/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 94
          min-coverage-changed-files: 95
          title: NetClean Coverage Report
          update-comment: true
