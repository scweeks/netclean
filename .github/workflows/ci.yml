name: CI

on:
  push:
    branches:
      - main
      - ci/**
      - feature/**
      - bugfix/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-analyze:
    name: PSSA + Pester + Coverage
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show PowerShell environment
        run: |
          $PSVersionTable
          Get-Module Pester -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 5 Name, Version, Path

      - name: Install PowerShell test and analysis tools
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -MinimumVersion 5.0.0 -MaximumVersion 5.999.999 -Force -SkipPublisherCheck -ErrorAction Stop
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.999.999 -Force -ErrorAction Stop
          if ((Get-Module Pester).Version.Major -ne 5) {
            throw 'CI requires Pester v5.'
          }
          Get-Module PSScriptAnalyzer -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 1 Name, Version, Path

      - name: Validate module manifest
        run: |
          Test-ModuleManifest .\NetClean.psd1 | Out-Null
          Write-Host 'Module manifest validated successfully.'

      - name: Run PSScriptAnalyzer
        run: |
          $settingsPath = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          if (-not (Test-Path -LiteralPath $settingsPath)) {
            throw "PSScriptAnalyzer settings file not found: $settingsPath"
          }

          $paths = @(
            '.\NetClean.ps1',
            '.\NetClean.psd1',
            '.\Modules\NetClean.psm1',
            '.\Modules\NetCleanPhase1.ps1',
            '.\Modules\NetCleanPhase2.ps1',
            '.\Modules\NetCleanPhase3.ps1',
            '.\Modules\NetCleanPhase4.ps1',
            '.\tests'
          ) | Where-Object { Test-Path -LiteralPath $_ }

          $results = @(
            foreach ($path in $paths) {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings $settingsPath
            }
          )

          if ($null -ne $results -and $results.Count -gt 0) {
            $results |
              Sort-Object Severity, ScriptName, Line |
              Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize

            $errors = @($results | Where-Object Severity -eq 'Error').Count
            $warnings = @($results | Where-Object Severity -eq 'Warning').Count

            Write-Host "PSScriptAnalyzer found $errors error(s) and $warnings warning(s)."

            if ($errors -gt 0 -or $warnings -gt 0) {
              throw 'PSScriptAnalyzer reported rule violations.'
            }
          }
          else {
            Write-Host 'PSScriptAnalyzer found no issues.'
          }

      - name: Run Pester with coverage
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\Run-NetClean-Coverage.ps1

      - name: Comment PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            ${{ github.workspace }}/tests/TestResults/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 95
          min-coverage-changed-files: 95
          title: NetClean Coverage Report
          update-comment: true

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netclean-test-results
          path: |
            tests/TestResults/**
          if-no-files-found: warn
          retention-days: 14
