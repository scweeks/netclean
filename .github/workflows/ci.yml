name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0 -AllowClobber
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          Invoke-ScriptAnalyzer -Path . -SettingsPath ./PSScriptAnalyzerSettings.psd1 -Recurse -Severity Warning,Error

      - name: Run Tests (Pester v5)
        shell: pwsh
        run: |
          Import-Module Pester
          Invoke-Pester -Path ./tests/Netclean.Tests.ps1 -CI